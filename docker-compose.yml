name: isaiah-routing-lab

x-vllm-common: &vllm-common
  image: nvcr.io/nvidia/vllm:26.05-py3
  restart: unless-stopped
  gpus: all
  ipc: host
  volumes:
    - /home/redhat-et/.cache/huggingface:/root/.cache/huggingface
  environment:
    - NVIDIA_VISIBLE_DEVICES=all

services:
  vllm-gptoss120b:
    <<: *vllm-common
    container_name: isaiah-vllm-gptoss120b
    ports:
      - "127.0.0.1:8001:8000"
    command: >
      vllm serve openai/gpt-oss-120b
      --served-model-name gpt-oss-120b
      --gpu-memory-utilization 0.60
      --max-model-len 32768
      --max-num-seqs 4
      --enable-auto-tool-choice --tool-call-parser openai --reasoning-parser openai_gptoss
      --host 0.0.0.0 --port 8000

  vllm-qwen3-30b:
    <<: *vllm-common
    container_name: isaiah-vllm-qwen3-30b
    ports:
      - "127.0.0.1:8002:8000"
    command: >
      vllm serve Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
      --served-model-name qwen3-30b-a3b
      --gpu-memory-utilization 0.29
      --max-model-len 32768
      --enable-auto-tool-choice --tool-call-parser hermes
      --host 0.0.0.0 --port 8000

  vllm-qwen3-4b:
    <<: *vllm-common
    container_name: isaiah-vllm-qwen3-4b
    ports:
      - "127.0.0.1:8003:8000"
    command: >
      vllm serve Qwen/Qwen3-4B-Instruct-2507-FP8
      --served-model-name qwen3-4b
      --gpu-memory-utilization 0.045
      --max-model-len 8192
      --enable-auto-tool-choice --tool-call-parser hermes
      --host 0.0.0.0 --port 8000

  vllm-qwen3-1_7b:
    <<: *vllm-common
    container_name: isaiah-vllm-qwen3-1_7b
    ports:
      - "127.0.0.1:8004:8000"
    command: >
      vllm serve Qwen/Qwen3-1.7B-FP8
      --served-model-name qwen3-1.7b
      --gpu-memory-utilization 0.030
      --max-model-len 4096
      --max-num-seqs 4
      --enable-auto-tool-choice --tool-call-parser hermes
      --reasoning-parser qwen3
      --host 0.0.0.0 --port 8000

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: isaiah-litellm
    restart: unless-stopped
    depends_on:
      - vllm-gptoss120b
      - vllm-qwen3-30b
      - vllm-qwen3-4b
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
